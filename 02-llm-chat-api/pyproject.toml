[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-chat-api"
version = "0.1.0"
description = "An LLM-powered chat API for exploring LLM application engineering."
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]