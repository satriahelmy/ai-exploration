name: Python AI API CI

on:
  push:
    paths:
      - "01-python-ai-api/**"
      - ".github/workflows/python-ai-api-ci.yml"

  pull_request:
    paths:
      - "01-python-ai-api/**"
      - ".github/workflows/python-ai-api-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 01-python-ai-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 01-python-ai-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t python-ai-api .