name: LLM Chat API CI

on:
  push:
    paths:
      - "02-llm-chat-api/**"
      - ".github/workflows/llm-chat-api-ci.yml"

  pull_request:
    paths:
      - "02-llm-chat-api/**"
      - ".github/workflows/llm-chat-api-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 02-llm-chat-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 02-llm-chat-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t llm-chat-api .