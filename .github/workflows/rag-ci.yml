name: RAG CI

on:
  push:
    paths:
      - "03-rag-document-qa/**"
      - ".github/workflows/rag-ci.yml"
  pull_request:
    paths:
      - "03-rag-document-qa/**"
      - ".github/workflows/rag-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: 03-rag-document-qa
        run: pip install ".[dev]"

      - name: Run tests
        working-directory: 03-rag-document-qa
        run: python -m pytest